    <text x="65" y="60" font-family="monospace" font-size="42"
          text-anchor="middle" fill="#A5B4FC">&lt;/&gt;</text>
    <path d="M-12 105 H142 L125 115 H5 Z" fill="#6366F1"/>
  </g>

  <text x="65" y="115" fill="#A5B4FC"
