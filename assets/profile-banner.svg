  </text>

  <text x="65" y="224" fill="#C4B5FD"
        font-family="Arial, sans-serif" font-size="34" font-weight="bold">
    Repeat.
  </text>

  <rect x="65" y="255" width="440" height="3" rx="2" fill="url(#glow)"/>

  <text x="65" y="286" fill="#94A3B8"
        font-family="Arial, sans-serif" font-size="16">
